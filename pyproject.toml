[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Shared with tools/ and kept runnable on the system python3 of a Mac (3.9):
# no StrEnum, no slots dataclasses, no match statements.
"custom_components/weishaupt_wpm/modbus.py" = ["UP"]
"custom_components/weishaupt_wpm/registers.py" = ["UP"]
"tools/*" = ["UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tools"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
